[project]
name = "greenthumb-core"
version = "0.1.0"
description = "Green Thumb. Smart gardening for hobbyists.  Green Thumb consists of a local component running on site in the garden. (E.g. on a Raspberry Pi) which manages and executes modular tasks and syncs to a cloud component."
authors = [
    {name = "Dominik Reiner",email = "dominik-reiner@web.de"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "loguru (>=0.7.3,<0.8.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "pydantic (>=2.11.3,<3.0.0)", "pyserial>=3.5,<4",
]

[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-aarch64"]

[tool.pixi.pypi-dependencies]
greenthumb-core = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.12.*"
pip = ">=25.1.1,<26"

[tool.pixi.environments]
default = {solve-group = "default"}
dev = {features = ["dev"], solve-group = "default"}

[dependency-groups]
dev = ["black", "pytest", "flake8", "mypy"]
